name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installs the full runtime stack (rtmlib, onnxruntime, opencv). That is
      # deliberate: the suite imports every module, so a dependency missing from
      # pyproject.toml fails here rather than on a stranger's first clone.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No model weights, no network, no GPU: every test builds its inputs from
      # mstudy.demo.generate() or hand-built frames.
      - name: Tests
        run: pytest tests -q
